<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Dogfight by MOQtail</title>
    <!-- Opened from the Home Screen, the game runs without browser bars: the iPhone's only way to fullscreen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020308;
        color: #e5e7eb;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        /* iPad: no selection box, magnifier or long-press menu over the game. */
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        margin: auto;
        outline: 2px solid #334155;
        outline-offset: -2px;
      }
      /* On-screen controls, only on touch screens: turn with the left thumb, fire with the right. */
      #touch {
        display: none;
      }
      @media (pointer: coarse) {
        #touch {
          display: block;
        }
      }
      #touch button {
        position: fixed;
        bottom: 24px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #64748b;
        background: #1e293b99;
        color: #e5e7eb;
        font: bold 28px system-ui;
        touch-action: none;
      }
      #touch button.held {
        background: #475569cc;
      }
      #touch [data-key='KeyA'] {
        left: 24px;
      }
      #touch [data-key='KeyD'] {
        left: 128px;
      }
      #touch [data-key='KeyW'] {
        left: 76px;
        bottom: 128px;
        width: 72px;
        height: 72px;
        font-size: 22px;
      }
      #touch [data-key='Space'] {
        right: 24px;
        width: 120px;
        height: 120px;
        border-color: #f87171;
        font-size: 22px;
      }
      #tools {
        position: fixed;
        top: 8px;
        right: 12px;
        z-index: 2; /* settings open over the scoreboard */
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      #fullscreen {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: #111827cc;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #fullscreen[hidden] {
        display: none;
      }
      #settings {
        background: #111827cc;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #settings summary {
        cursor: pointer;
      }
      #settings fieldset {
        border: 0;
        margin: 6px 0 2px;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      #settings legend {
        color: #9ca3af;
        padding: 0;
        margin-bottom: 4px;
      }
      #join {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(340px, calc(100% - 32px));
        height: fit-content;
        max-height: calc(100% - 16px);
        overflow: auto;
        box-sizing: border-box;
        display: grid;
        gap: 14px;
        padding: 20px;
        background: #111827;
        border: 1px solid #374151;
        border-radius: 10px;
        z-index: 1;
      }
      #join[hidden] {
        display: none;
      }
      #join h1 {
        margin: 0;
        font-size: 22px;
      }
      #join label {
        display: grid;
        gap: 4px;
        color: #9ca3af;
      }
      #join input[type='text'] {
        font: 16px system-ui; /* 16px or more: iPad Safari zooms into smaller inputs */
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #0b1020;
        color: #e5e7eb;
        -webkit-user-select: text;
        user-select: text;
      }
      #colors {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #colors legend {
        color: #9ca3af;
        padding: 0;
        margin-bottom: 4px;
      }
      #colors input {
        appearance: none;
        width: 32px;
        height: 32px;
        margin: 0;
        border-radius: 50%;
        background: var(--c);
        border: 3px solid transparent;
        cursor: pointer;
      }
      #colors input:checked {
        border-color: #f9fafb;
      }
      #colors input:focus-visible {
        outline: 2px solid #f9fafb;
        outline-offset: 2px;
      }
      #invite {
        margin: 0;
        color: #9ca3af;
        font-size: 13px;
        word-break: break-all;
      }
      #join button {
        font: bold 16px system-ui;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      #scores {
        position: fixed;
        top: 48px;
        right: 12px;
        margin: 0;
        padding: 6px 10px;
        list-style: none;
        background: #111827aa;
        border-radius: 6px;
        font-size: 13px;
        display: grid;
        gap: 2px;
        min-width: 140px;
      }
      #scores:empty {
        display: none;
      }
      #scores li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 12px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="hud">Connecting…</div>
    <div id="tools">
      <button id="fullscreen" title="Full screen (F)" aria-label="Full screen">⛶</button>
      <details id="settings">
        <summary>⚙ Settings</summary>
        <fieldset>
          <legend>Sounds</legend>
          <label><input type="checkbox" data-sound="fire" /> Firing</label>
          <label><input type="checkbox" data-sound="hit" /> Getting hit</label>
          <label><input type="checkbox" data-sound="death" /> Shot down</label>
        </fieldset>
      </details>
    </div>
    <canvas id="game"></canvas>
    <ol id="scores" aria-label="Scoreboard"></ol>
    <form id="join">
      <h1>Dogfight</h1>
      <label>Your name <input type="text" name="name" maxlength="16" required autocomplete="nickname" /></label>
      <fieldset id="colors"><legend>Colour</legend></fieldset>
      <label>Room <input type="text" name="room" maxlength="32" autocapitalize="off" /></label>
      <p id="invite"></p>
      <button>Join</button>
    </form>
    <div id="touch">
      <button data-key="KeyA" aria-label="Turn left">◀</button>
      <button data-key="KeyD" aria-label="Turn right">▶</button>
      <button data-key="KeyW" aria-label="Boost">▲</button>
      <button data-key="Space" aria-label="Fire">FIRE</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
