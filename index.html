<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Dogfight by MOQtail</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #020308;
        color: #e5e7eb;
        font:
          14px system-ui,
          sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        /* iPad: no selection box, magnifier or long-press menu over the game. */
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        margin: auto;
        outline: 2px solid #334155;
        outline-offset: -2px;
      }
      /* On-screen controls, only on touch screens: turn with the left thumb, fire with the right. */
      #touch {
        display: none;
      }
      @media (pointer: coarse) {
        #touch {
          display: block;
        }
      }
      #touch button {
        position: fixed;
        bottom: 24px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #64748b;
        background: #1e293b99;
        color: #e5e7eb;
        font: bold 28px system-ui;
        touch-action: none;
      }
      #touch button.held {
        background: #475569cc;
      }
      #touch [data-key='KeyA'] {
        left: 24px;
      }
      #touch [data-key='KeyD'] {
        left: 128px;
      }
      #touch [data-key='Space'] {
        right: 24px;
        width: 120px;
        height: 120px;
        border-color: #f87171;
        font-size: 22px;
      }
      #settings {
        position: fixed;
        top: 8px;
        right: 12px;
        background: #111827cc;
        border: 1px solid #374151;
        border-radius: 6px;
        padding: 4px 10px;
      }
      #settings summary {
        cursor: pointer;
      }
      #settings fieldset {
        border: 0;
        margin: 6px 0 2px;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      #settings legend {
        color: #9ca3af;
        padding: 0;
        margin-bottom: 4px;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 12px;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="hud">Connecting…</div>
    <details id="settings">
      <summary>⚙ Settings</summary>
      <fieldset>
        <legend>Sounds</legend>
        <label><input type="checkbox" data-sound="fire" /> Firing</label>
        <label><input type="checkbox" data-sound="hit" /> Getting hit</label>
        <label><input type="checkbox" data-sound="death" /> Shot down</label>
      </fieldset>
    </details>
    <canvas id="game"></canvas>
    <div id="touch">
      <button data-key="KeyA" aria-label="Turn left">◀</button>
      <button data-key="KeyD" aria-label="Turn right">▶</button>
      <button data-key="Space" aria-label="Fire">FIRE</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
